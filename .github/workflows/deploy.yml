# Publica PokéBox One en GitHub Pages en cada push a main (o a mano desde la pestaña Actions).
# Requisito único en el repo: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un solo despliegue a la vez; no se cancela uno en curso.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # El sitio vive en https://<usuario>.github.io/<repo>/, así que la ruta base es /<repo>/.
      - name: Compilar
        run: npm run build
        env:
          PBX_BASE_PATH: /${{ github.event.repository.name }}/

      # GitHub Pages no reescribe rutas: con un 404.html igual al index.html, los enlaces directos
      # y las recargas en rutas internas (p. ej. /pokemon/25) cargan la app en vez del 404 de GitHub.
      - name: Fallback de rutas
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@v5
